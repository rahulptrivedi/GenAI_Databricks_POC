[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "databricks-uc-chatbot"
version = "0.1.0"
description = "A governed, read-only Databricks Unity Catalog chatbot."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "databricks-sdk>=0.60,<1.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlglot>=26.0,<31.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2.0",
    "httpx>=0.28,<1.0",
    "mypy>=1.14,<2.0",
    "poethepoet>=0.32,<1.0",
    "pyyaml>=6.0,<7.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
    "types-PyYAML>=6.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.poe.tasks]
install = "uv sync --all-groups"
format = "ruff format app tests scripts"
format-check = "ruff format --check app tests scripts"
lint = "ruff check app tests scripts"
typecheck = "mypy app scripts"
test = "pytest"
test-unit = "pytest tests/unit"
test-integration = "python scripts/run_integration_tests.py"
test-contract = "pytest tests/contract"
coverage = "pytest --cov=app --cov-report=term-missing"
security = "bandit -q -r app scripts"
secret-scan = "python scripts/scan_secrets.py"
bundle-validate = "python scripts/validate_bundle.py"
validate = ["format-check", "lint", "typecheck", "test-unit", "security", "secret-scan", "bundle-validate"]
run = "uvicorn app.api.application:app --host 127.0.0.1 --port 8000"
seed-data = "python scripts/deploy_catalog.py seed"
catalog-grant-reader = "python scripts/deploy_catalog.py grant-reader"
evaluate = "pytest tests/evaluation"
clean = "python scripts/clean_local.py"
catalog-clean = "python scripts/deploy_catalog.py clean"
deploy-dev = "databricks bundle deploy -t dev"
deploy-test = "databricks bundle deploy -t test"
deploy-prod = "databricks bundle deploy -t prod"
