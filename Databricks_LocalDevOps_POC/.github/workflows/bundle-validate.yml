name: Databricks Bundle Validation

on:
  workflow_dispatch:
    inputs:
      target:
        description: Bundle target to validate
        type: choice
        options: [dev, test, prod]
        default: dev
        required: true
  pull_request:
    paths:
      - "Databricks_LocalDevOps_POC/databricks.yml"
      - "Databricks_LocalDevOps_POC/resources/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Databricks_LocalDevOps_POC
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: uv sync --locked --all-groups
      - name: Validate bundle locally or against the selected workspace
        env:
          BUNDLE_TARGET: ${{ inputs.target || 'dev' }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
        run: uv run poe bundle-validate